<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verktøykontroll – test</title><meta name="theme-color" content="#14263d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{font:15px system-ui,sans-serif;color:#1d2939;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#14263d;color:white;padding:20px max(16px,calc((100vw - 1100px)/2))}header h1{margin:0;font-size:25px}header p{margin:5px 0;color:#b8cadc}main{max-width:1100px;margin:20px auto;padding:0 14px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button{border:0;border-radius:9px;padding:11px 14px;background:#2365a8;color:white;cursor:pointer;font:inherit}button.alt{background:#e6edf5;color:#20344a}button.warn{background:#ad493b}button:disabled{opacity:.5;cursor:not-allowed}.nav button.active{background:#14263d}section{background:white;border:1px solid #dce5ef;border-radius:14px;padding:18px;margin:0 0 16px}h2{font-size:19px;margin:0 0 15px}h3{font-size:16px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#eef4fa;padding:15px;border-radius:10px}.stat b{font-size:28px;display:block}.muted{color:#65758a;font-size:13px}input,select{width:100%;padding:11px;border:1px solid #cbd6e2;border-radius:8px;font:inherit;background:white}label{display:block;font-size:13px;font-weight:600;margin:9px 0 4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{padding:12px 0;border-bottom:1px solid #e6edf4;display:flex;align-items:center;justify-content:space-between;gap:10px}.item:last-child{border:0}.item b{display:block}.pill{display:inline-block;background:#e7f5ec;color:#12643d;border-radius:12px;padding:3px 8px;font-size:12px}.pill.out{background:#fff0da;color:#995500}.notice{background:#fff2d8;padding:12px;border-radius:9px;color:#76500e}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.hidden{display:none!important}#scanner video{width:100%;max-height:300px;background:black;border-radius:10px}.qr{width:110px;height:110px;object-fit:contain;background:white}.card{border:1px solid #dce5ef;border-radius:10px;padding:12px;margin:8px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.smallbtn{padding:7px 10px;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:10px}.stat b{font-size:22px}.item{align-items:flex-start}}
@media print{header,.nav,.no-print,button{display:none!important}main{margin:0}.card{break-inside:avoid}}
</style></head><body><header><h1>🔧 Verktøykontroll</h1><p>Testversjon 0.9.2 · Mobiltest · Lokal lagring · Offline</p></header><main><div class="nav" id="nav"></div><div id="app"></div></main><script>
const KEY='verktoykontroll-demo-v02';const seed=()=>({locations:[{id:'L1',name:'Sandnessjøen'},{id:'L2',name:'Mosjøen'}],departments:['Verksted','Vedlikehold','Produksjon'],warehouses:[{id:'W1',name:'Hovedlager',location:'L1'},{id:'W2',name:'Delelager',location:'L2'}],people:[{id:'A001',name:'Ola Hansen',location:'L1',department:'Verksted'},{id:'A002',name:'Kari Nilsen',location:'L2',department:'Vedlikehold'}],tools:[{id:'V001',name:'DeWalt drill',serial:'DW-123',warehouse:'W1',holder:null},{id:'V002',name:'DeWalt muttertrekker',serial:'DW-456',warehouse:'W1',holder:'A001'},{id:'V003',name:'Bosch borhammer',serial:'BO-789',warehouse:'W2',holder:null}],groups:[{id:'G001',name:'Driller'},{id:'G002',name:'Muttertrekkere'},{id:'G003',name:'Borhammere'}],events:[]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()} db.deletedIds ||= [];db.groups ||= []; db.cases ||= []; db.cases.forEach(c=>{c.missing ||= []}); db.tools.forEach(t=>{t.qrId ||= 'TOOL-'+t.id+'-'+Math.random().toString(36).slice(2,10).toUpperCase();t.qrMarked ||= false;if(!('caseId' in t))t.caseId=null;if(!t.condition)t.condition='active';t.conditionNote ||= ''}); db.tools.forEach(t=>{if(!('group' in t)){const gn=t.name.toLowerCase().includes('mutter')?'Muttertrekkere':t.name.toLowerCase().includes('borhammer')?'Borhammere':'Driller';let g=db.groups.find(g=>g.name===gn);if(!g){g={id:'G'+String(db.groups.length+1).padStart(3,'0'),name:gn};db.groups.push(g)}t.group=g.id}});let openGroups={};let tab='oversikt',chosen=null,scanTarget='tool',stream=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(db));save();const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const name=(list,id)=>list.find(x=>x.id===id)?.name||id||'—';const person=id=>name(db.people,id);const loc=id=>name(db.locations,id);const warehouse=id=>name(db.warehouses,id);const date=()=>new Date().toLocaleString('no-NO');const log=(action,detail)=>db.events.unshift({date:date(),action,detail});const uid=(prefix,arr)=>prefix+String(Math.max(0,...arr.map(x=>Number(x.id.slice(1))||0))+1).padStart(3,'0');function setTab(t){stopCamera();tab=t;render()}function nav(){const tabs=[['oversikt','Oversikt'],['utlaan','Utlån / innlevering'],['ansatte','Ansatte'],['tilbakemelding','Tilbakemelding'],['verktoy','Verktøy'],['kasser','Verktøykasser'],['lager','Lokasjoner'],['historikk','Historikk']];$('#nav').innerHTML=tabs.map(([id,n])=>`<button class="${tab===id?'active':'alt'}" onclick="setTab('${id}')">${n}</button>`).join('')}function opts(arr,current){return arr.map(x=>`<option value="${esc(x.id)}" ${x.id===current?'selected':''}>${esc(x.name)}</option>`).join('')}function render(){nav();let h='';if(tab==='oversikt')h=`<section><h2>Dashboard</h2><div class="stats"><div class="stat"><b>${db.tools.length}</b>Verktøy</div><div class="stat"><b>${db.tools.filter(t=>t.holder).length}</b>Utlånt</div><div class="stat"><b>${db.tools.filter(t=>!t.holder&&t.condition==='active').length}</b>På lager</div></div><p class="notice">Testmodus: Alt lagres kun i denne nettleseren. Ingen ekte innlogging, felles database eller synkronisering er aktivert.</p><div class="actions"><button onclick="setTab('utlaan')">Start skanning</button><button class="alt" onclick="exportData()">Eksporter sikkerhetskopi</button></div></section><section><h2>Siste bevegelser</h2>${history(5)}</section>`;
if(tab==='utlaan')h=`<section><h2>Registrer utlån eller innlevering</h2><div class="grid"><div><label>Skann ansattkort eller velg ansatt</label><select id="employee"><option value="">Velg ansatt</option>${opts(db.people,chosen)}</select><div class="actions"><button class="alt" onclick="startCamera('person')">📷 Skann ansatt-QR</button></div></div><div><label>Skann verktøy eller skriv verktøykode</label><input id="toolcode" placeholder="F.eks. V001" onkeydown="if(event.key==='Enter')processTool()"><div class="actions"><button class="alt" onclick="startCamera('tool')">📷 Skann verktøy-QR</button><button onclick="processTool()">Finn verktøy</button></div></div></div><div id="scanner" class="hidden"><h3>Kameraskanning</h3><div id="qr-reader"></div><p id="camera-status" class="muted" role="status"></p><div class="actions"><button class="alt" onclick="stopCamera()">Stopp kamera</button></div><p class="muted">Krever HTTPS eller localhost og en nettleser med QR-støtte. Manuell kode fungerer alltid.</p></div><div id="result"></div></section><section><h2>Verktøy med status</h2>${toolRows(true)}</section>`;
if(tab==='ansatte')h=`<section><h2>Søk etter ansatt</h2><div class="grid"><div><label>Navn eller ansattnummer</label><input id="person-search" placeholder="Søk på navn / nummer" oninput="filterPeople()"></div><div><label>Skann ansattkort</label><div class="actions"><button class="alt" onclick="startCamera('lookup')">📷 Skann ansatt-QR</button></div></div></div><div id="scanner" class="hidden"><div id="qr-reader"></div><p id="camera-status" role="status"></p><button class="alt" onclick="stopCamera()">Stopp kamera</button></div><div id="person-lookup"></div></section><section><h2>Ansattregister og QR-kort</h2><form onsubmit="addPerson(event)"><div class="grid"><div><label>Navn</label><input name="name" required placeholder="Fornavn Etternavn"></div><div><label>Lokasjon</label><select name="location">${opts(db.locations)}</select></div><div><label>Avdeling</label><select name="department">${db.departments.map(d=>`<option>${esc(d)}</option>`).join('')}</select></div></div><div class="actions"><button>Legg til ansatt</button></div></form></section><section><h2>Ansatte (${db.people.length})</h2><div id="people-list">${db.people.map(p=>`<div class="card" data-person="${esc((p.name+' '+p.id).toLowerCase())}"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.id)} · ${esc(loc(p.location))} · ${esc(p.department)}</div><div class="muted">${db.tools.filter(t=>t.holder===p.id).length} verktøy utlånt</div></div><button class="alt smallbtn" onclick="showPerson('${p.id}')">Se utlån</button><button class="alt right smallbtn" onclick="printCode('${p.id}')">Vis / skriv ut QR</button><button class="alt smallbtn" onclick="movePerson('${p.id}')">Flytt</button></div></div>`).join('')}</div></section>`;
if(tab==='tilbakemelding')h=`<section><h2>Tilbakemeldinger til utvikler</h2><p class="notice">I denne lokale testversjonen sendes ikke tilbakemeldinger automatisk. Du kan laste ned en rapport og sende den til utvikleren. Ikke legg inn interne personopplysninger.</p><form onsubmit="saveFeedback(event)"><label>Type</label><select name="kind"><option>Feil</option><option>Forbedringsforslag</option><option>Annet</option></select><label>Prioritet</label><select name="priority"><option>Normal</option><option>Viktig</option><option>Kritisk</option></select><label>Beskrivelse</label><textarea name="description" required minlength="5" rows="5" style="width:100%"></textarea><div class="actions"><button>Registrer lokalt</button><button type="button" class="alt" onclick="exportFeedback()">Last ned rapport</button></div></form></section><section><h2>Registrerte tilbakemeldinger</h2>${(db.feedback||[]).map(f=>`<div class="card"><b>${esc(f.kind)} · ${esc(f.priority)}</b><p>${esc(f.description)}</p><small>${esc(f.date)}</small></div>`).join('')||'<p>Ingen tilbakemeldinger ennå.</p>'}</section>`;
if(tab==='verktoy')h=`<section><h2>Verktøygrupper</h2><form onsubmit="addGroup(event)"><div class="grid"><div><label>Ny gruppe</label><input name="name" required placeholder="F.eks. Vinkelslipere"></div><div style="align-self:end"><button>Opprett gruppe</button></div></div></form><p class="muted">Samle like verktøy i en gruppe. Hvert verktøy får fortsatt sin egen ID og QR-kode.</p></section><section><h2>Registrer ett eller flere verktøy</h2><form onsubmit="addTool(event)"><div class="grid"><div><label>Gruppe</label><select name="group" required><option value="">Velg gruppe</option>${opts(db.groups)}</select></div><div><label>Navn / modell</label><input name="name" required placeholder="DeWalt DCG405"></div><div><label>Eget verktøynummer (valgfritt, kun ved antall 1)</label><input name="customId" placeholder="F.eks. 10452 eller VS-018"></div><div><label>Antall</label><input name="quantity" type="number" min="1" max="100" value="1" required></div><div><label>Serienummer (kun ved antall 1)</label><input name="serial" placeholder="Valgfritt"></div><div><label>Fast lager</label><select name="warehouse">${opts(db.warehouses)}</select></div></div><div class="actions"><button>Registrer verktøy</button></div></form></section><section><h2>Importer / skriv ut QR</h2><p class="muted">Importer CSV (UTF-8) med kolonnene nummer,navn,gruppe,lager,serienummer. Gruppe og lager kan være navn eller ID. Alle importerte verktøy får unik QR-identitet.</p><input type="file" id="import-file" accept=".csv,text/csv"><div class="actions"><button onclick="importCsv()">Importer CSV</button><button class="alt" onclick="printAllCodes()">Skriv ut alle QR-etiketter</button><button class="alt" onclick="printUnmarkedCodes()">Skriv ut ikke-merkede</button></div></section><section><h2>Verktøy etter gruppe</h2>${toolRows(false)}</section>`;
if(tab==='kasser')h=`<section><h2>Verktøykasser</h2><p class="muted">Opprett en kasse, legg verktøy i den og lån ut hele kassen med én QR-kode. Hvert verktøy beholder sin egen ID og historikk. Verktøy fra forskjellige lager kan ikke blandes i samme kasse.</p><form onsubmit="addCase(event)"><div class="grid"><div><label>Navn på kasse</label><input name="name" required placeholder="F.eks. Vinkelsliper-kasse 1"></div><div><label>Fast lager</label><select name="warehouse">${opts(db.warehouses)}</select></div></div><div class="actions"><button>Opprett verktøykasse</button></div></form></section><section><h2>Registrerte kasser (${db.cases.length})</h2>${db.cases.map(c=>{const ts=db.tools.filter(t=>t.caseId===c.id);return `<div class="card"><div class="row"><div><b>🧰 ${esc(c.name)} (${esc(c.id)})</b><div class="muted">${esc(warehouse(c.warehouse))} · ${ts.length} verktøy · ${c.holder?'Utlånt til '+esc(person(c.holder)):'På lager'}</div></div><button class="alt smallbtn" onclick="printCode('${c.id}')">QR-kode</button></div><div class="actions"><button class="alt smallbtn" onclick="manageCase('${c.id}')">Legg til / fjern verktøy</button>${c.holder?`<button onclick="checkinCase('${c.id}')">Kontroller retur</button>`:`<button onclick="checkoutCase('${c.id}')">Lån ut hele kassen</button>`}</div>${c.missing?.length?`<p class="notice">Siste retur hadde avvik: ${c.missing.map(esc).join(', ')}</p>`:''}${ts.map(t=>`<div class="item"><span>${esc(t.name)} · ${esc(t.id)}</span><span class="muted">${t.condition==='retired'?'Utrangert':t.condition==='repair'?'Til reparasjon':t.condition==='broken'?'Defekt':t.holder?'Utlånt':'På lager'}</span></div>`).join('')}</div>`}).join('')||'<p class="muted">Ingen kasser registrert.</p>'}</section>`;
if(tab==='forbruk')h=`<section><h2>Forbrukslager</h2><p class="muted">Lagerbeholdning per lager. Uttak og påfyll loggføres. Varer under minimum vises med varsel.</p><form onsubmit="addConsumable(event)"><div class="grid"><div><label>Varenavn</label><input name="name" required placeholder="F.eks. Slipeskive 125 mm"></div><div><label>Lager</label><select name="warehouse">${opts(db.warehouses)}</select></div><div><label>Enhet</label><select name="unit"><option>stk</option><option>pakker</option><option>meter</option><option>liter</option></select></div><div><label>Startbeholdning</label><input name="quantity" type="number" min="0" step="1" value="0" required></div><div><label>Minimumsbeholdning</label><input name="minimum" type="number" min="0" step="1" value="10" required></div></div><div class="actions"><button>Opprett forbruksvare</button></div></form></section><section><h2>Lagerstatus</h2>${db.consumables.map(x=>`<div class="card"><div class="row"><div><b>${esc(x.name)} (${esc(x.id)})</b><div class="muted">${esc(warehouse(x.warehouse))} · Minimum ${x.minimum} ${esc(x.unit)}</div></div><div><b>${x.quantity} ${esc(x.unit)}</b> ${x.quantity<=x.minimum?'<span class="pill out">Bestill mer</span>':'<span class="pill">På lager</span>'}</div></div><div class="actions"><button class="alt smallbtn" onclick="changeStock('${x.id}',-1)">Ta ut</button><button class="alt smallbtn" onclick="changeStock('${x.id}',1)">Fyll på</button><button class="alt smallbtn" onclick="printCode('${x.id}')">QR-kode</button></div></div>`).join('')||'<p>Ingen forbruksvarer registrert.</p>'}</section>`;
if(tab==='lager')h=`<section><h2>Lokasjoner og faste lager</h2>${db.locations.map(l=>`<div class="card"><b>${esc(l.name)}</b><div class="muted">${db.warehouses.filter(w=>w.location===l.id).map(w=>w.name).join(', ')||'Ingen lager'}</div></div>`).join('')}<h3>Legg til lokasjon</h3><form onsubmit="addLocation(event)"><input name="name" required placeholder="Navn på lokasjon"><div class="actions"><button>Opprett lokasjon</button></div></form><h3>Legg til lager</h3><form onsubmit="addWarehouse(event)"><div class="grid"><input name="name" required placeholder="Lagernavn"><select name="location">${opts(db.locations)}</select></div><div class="actions"><button>Opprett lager</button></div></form><p class="muted">Verktøyets faste lager kan ikke endres i denne testversjonen. Ansatte kan flyttes mellom lokasjoner.</p></section>`;
if(tab==='historikk')h=`<section><h2>Hendelseslogg</h2>${history(100)}</section><section><h2>Testdata og sikkerhetskopi</h2><div class="actions"><button class="alt" onclick="exportData()">Eksporter JSON</button><button class="warn" onclick="resetDemo()">Nullstill testdata</button></div></section>`;$('#app').innerHTML=h; if(tab==='utlaan'&&chosen)$('#employee').value=chosen}function history(n){return db.events.slice(0,n).map(e=>`<div class="item"><div><b>${esc(e.action)}</b><span class="muted">${esc(e.detail)} · ${esc(e.date)}</span></div></div>`).join('')||'<p class="muted">Ingen registreringer ennå.</p>'}function toggleGroup(id){openGroups[id]=!(openGroups[id]??true);render()}function toolRows(compact){const groups=[...db.groups,{id:'_none',name:'Uten gruppe'}].filter(g=>db.tools.some(t=>(t.group||'_none')===g.id));return groups.map(g=>{const items=db.tools.filter(t=>(t.group||'_none')===g.id),out=items.filter(t=>t.holder).length,expanded=openGroups[g.id]??true;return `<div class="card"><div class="row" style="cursor:pointer" onclick="toggleGroup('${g.id}')"><div><b>📁 ${esc(g.name)}</b><div class="muted">${items.length} totalt · ${items.length-out} på lager · ${out} utlånt</div></div><button type="button" class="alt smallbtn right">${expanded?'Skjul ▲':'Vis ▼'}</button></div>${expanded?items.map(t=>`<div class="item"><div><b>${esc(t.name)} <span class="pill ${t.holder?'out':''}">${t.condition==='retired'?'Utrangert':t.condition==='repair'?'Til reparasjon':t.condition==='broken'?'Defekt':t.holder?'Utlånt':'På lager'}</span></b><span class="muted">${esc(t.id)} · ${esc(warehouse(t.warehouse))} · ${t.holder?'Hos '+esc(person(t.holder)):t.condition==='active'?'Tilgjengelig':'Ikke tilgjengelig'}${t.serial?' · SN '+esc(t.serial):''} · QR: ${t.qrMarked?'Festet':'Ikke festet'}</span></div><div class="actions">${compact?`<button class="alt smallbtn" onclick="selectTool('${t.id}')">Velg</button>`:`<button class="alt smallbtn" onclick="printCode('${t.id}')">QR-kode</button><button class="alt smallbtn" onclick="setToolCondition('${t.id}')">Endre status</button><button class="alt smallbtn" onclick="replaceTool('${t.id}')">Erstatt</button><button class="warn smallbtn" onclick="deleteTool('${t.id}')">Slett</button><button class="alt smallbtn" onclick="markQr('${t.id}')">${t.qrMarked?'✓ QR festet':'Merk QR festet'}</button>`}</div></div>`).join(''):''}</div>`}).join('')||'<p>Ingen verktøy.</p>'}function addGroup(e){e.preventDefault();const n=e.target.elements.name.value.trim();if(db.groups.some(g=>g.name.toLowerCase()===n.toLowerCase()))return alert('Gruppen finnes allerede.');const g={id:uid('G',db.groups),name:n};db.groups.push(g);log('Verktøygruppe opprettet',n);save();render()}
function filterPeople(){const q=($('#person-search')?.value||'').trim().toLowerCase();document.querySelectorAll('[data-person]').forEach(el=>el.style.display=el.dataset.person.includes(q)?'':'none')}
function showPerson(id){const p=db.people.find(x=>x.id===id);if(!p)return;const loans=db.tools.filter(t=>t.holder===id);const cases=db.cases.filter(c=>c.holder===id);const el=$('#person-lookup');if(!el){setTab('ansatte');setTimeout(()=>showPerson(id),0);return}el.innerHTML=`<div class="card"><h3>${esc(p.name)} (${esc(p.id)})</h3><p>${loans.length} verktøy ute · ${cases.length} verktøykasser ute</p>${loans.map(t=>`<div class="item">${esc(t.name)} · ${esc(t.id)}${t.caseId?' · I kasse '+esc(t.caseId):''}</div>`).join('')||'<p>Ingen verktøy ute.</p>'}${cases.map(c=>`<div class="item">🧰 ${esc(c.name)} · ${esc(c.id)}</div>`).join('')}<button class="alt" onclick="printCode('${p.id}')">Skriv ut ansatt-QR</button></div>`;el.scrollIntoView({behavior:'smooth',block:'nearest'})}
function saveFeedback(e){e.preventDefault();const f=e.target;db.feedback=db.feedback||[];db.feedback.push({kind:f.elements.kind.value,priority:f.elements.priority.value,description:f.elements.description.value.trim(),date:new Date().toLocaleString('nb-NO'),appVersion:'0.9.2'});save();render();alert('Tilbakemelding lagret lokalt. Last ned rapporten for å dele den med utvikleren.')}
function exportFeedback(){const data=JSON.stringify(db.feedback||[],null,2);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='verktoykontroll-tilbakemeldinger.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function addPerson(e){e.preventDefault();const f=e.target;const p={id:uid('A',db.people),name:f.elements.name.value.trim(),location:f.elements.location.value,department:f.elements.department.value};db.people.push(p);log('Ansatt opprettet',p.name);save();render()}function addTool(e){e.preventDefault();const f=e.target;const q=Number(f.elements.quantity.value);if(!Number.isInteger(q)||q<1||q>100)return alert('Velg 1–100 verktøy.');const group=f.elements.group.value;if(!db.groups.some(g=>g.id===group))return alert('Velg en gruppe.');const n=f.elements.name.value.trim(),wh=f.elements.warehouse.value,serial=f.elements.serial.value.trim(),customId=f.elements.customId.value.trim().toUpperCase();if(customId){if(q!==1)return alert('Eget verktøynummer kan bare brukes ved registrering av ett verktøy.');if(!/^[A-Z0-9_-]{1,32}$/.test(customId))return alert('Bruk 1–32 tegn: bokstaver, tall, bindestrek eller understrek.');if([...db.tools,...db.cases,...db.people].some(x=>x.id.toUpperCase()===customId)||db.deletedIds.includes(customId))return alert('Nummeret er allerede i bruk.')} if(q>1&&serial&&!confirm('Serienummeret blir ikke brukt ved masseregistrering. Fortsette?'))return;for(let i=0;i<q;i++){db.tools.push({id:customId||nextToolId(),name:n,serial:q===1?serial:'',warehouse:wh,group,holder:null,condition:'active',conditionNote:'',qrId:'TOOL-'+crypto.randomUUID(),qrMarked:false})}log('Verktøy registrert',`${q} × ${n} (${name(db.groups,group)})`);save();render()}
function setToolCondition(id){const t=db.tools.find(x=>x.id===id);if(!t)return;const values={active:'På lager / aktiv',broken:'Defekt',repair:'Til reparasjon',retired:'Utrangert'};const keys=Object.keys(values);const answer=prompt('Velg status for '+t.name+' ('+t.id+'):\n'+keys.map((k,i)=>(i+1)+'. '+values[k]).join('\n')+'\n\nSkriv 1–4:',String(keys.indexOf(t.condition||'active')+1));if(answer===null)return;const status=keys[Number(answer)-1];if(!status)return alert('Ugyldig status.');if(t.holder&&status!==t.condition)return alert('Verktøyet er utlånt. Registrer innlevering før status endres.');if(t.caseId&&db.cases.find(c=>c.id===t.caseId)?.holder)return alert('Kassen er utlånt. Returner kassen først.');const note=status==='active'?'':prompt('Årsak / kommentar til statusendring:',t.conditionNote||'');if(note===null)return;if(status==='retired'&&!confirm('Utrangere '+t.id+' permanent? Historikken beholdes.'))return;t.condition=status;t.conditionNote=note.trim();log('Verktøystatus endret',t.id+' → '+values[status]+(t.conditionNote?' · '+t.conditionNote:''));save();render()}

function nextToolId(){let n=1;while(db.tools.some(t=>t.id==='V'+String(n).padStart(3,'0'))||db.deletedIds.includes('V'+String(n).padStart(3,'0')))n++;return 'V'+String(n).padStart(3,'0')}
function confirmDuplicate(pid,incoming){const current=db.tools.filter(t=>t.holder===pid);const matches=incoming.flatMap(t=>current.filter(x=>x.group===t.group&&x.id!==t.id).map(x=>`${t.name} (${t.id}) – har allerede ${x.name} (${x.id})`));if(!matches.length)return true;const yes=confirm('ADVARSEL: Ansatt har allerede verktøy fra samme gruppe:\n'+matches.join('\n')+'\n\nLåne ut likevel?');if(yes)log('Dobbeltutlån godkjent',person(pid)+' · '+matches.join('; '));return yes}
function markQr(id){const t=db.tools.find(x=>x.id===id);if(!t)return;t.qrMarked=!t.qrMarked;log('QR-merking',t.id+' '+(t.qrMarked?'festet':'ikke festet'));save();render()}
function replaceTool(id){const old=db.tools.find(t=>t.id===id);if(!old)return;if(old.holder||db.cases.some(c=>c.id===old.caseId&&c.holder))return alert('Lever inn verktøyet eller kassen før erstatning.');const number=prompt('Verktøynummer for nytt verktøy (kan beholde '+id+'):',id);if(number===null)return;const n=number.trim().toUpperCase();if(!/^[A-Z0-9_-]{1,32}$/.test(n))return alert('Ugyldig nummer.');if(n!==id&&(db.tools.some(t=>t.id===n)||db.deletedIds.includes(n)))return alert('Nummeret er i bruk eller reservert.');const serial=prompt('Serienummer på nytt verktøy (valgfritt):','');if(serial===null)return;if(!confirm('Erstatt '+id+' med nytt verktøy '+n+'? Gammelt verktøy arkiveres og får egen historikk. Ny QR må skrives ut.'))return;const archive='ARK-'+crypto.randomUUID().slice(0,12).toUpperCase();old.originalNumber=old.originalNumber||old.id;old.id=archive;old.condition='retired';old.conditionNote='Erstattet med '+n;old.caseId=null;db.tools.push({...old,id:n,originalNumber:n,serial:serial.trim(),condition:'active',conditionNote:'',holder:null,caseId:null,qrId:'TOOL-'+crypto.randomUUID(),qrMarked:false,replaces:archive});log('Verktøy erstattet',id+' → '+n+' (gammelt arkivert som '+archive+')');save();render()}
function deleteTool(id){const t=db.tools.find(x=>x.id===id);if(!t)return;if(t.holder||t.caseId)return alert('Verktøyet må leveres inn og tas ut av verktøykasse før sletting.');if(!confirm('Slette '+id+' permanent fra verktøyregisteret? Dette kan ikke angres. Ta sikkerhetskopi først.'))return;const check=prompt('Skriv SLETT for å bekrefte:');if(check!=='SLETT')return;db.deletedIds.push(id);db.tools=db.tools.filter(x=>x!==t);log('Verktøy slettet',id+' · '+t.name);save();render()}
function parseCsv(text){const rows=[];let row=[],field='',quote=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quote&&text[i+1]==='"'){field+='"';i++}else quote=!quote}else if(!quote&&(c===','||c===';'||c==='\n')){row.push(field.trim());field='';if(c==='\n'){if(row.some(x=>x))rows.push(row);row=[]}}else if(c!=='\r')field+=c}row.push(field.trim());if(row.some(x=>x))rows.push(row);return rows}
async function importCsv(){const file=$('#import-file')?.files?.[0];if(!file)return alert('Velg en CSV-fil først.');const rows=parseCsv(await file.text());if(rows.length<2)return alert('Ingen datarader funnet.');const head=rows.shift().map(x=>x.toLowerCase().trim());const ix=(...names)=>head.findIndex(h=>names.includes(h));const cols=[ix('nummer','verktøynummer','id'),ix('navn','verktøy','modell'),ix('gruppe'),ix('lager'),ix('serienummer','serial')];if(cols[0]<0||cols[1]<0)return alert('CSV må ha kolonnene nummer og navn.');const errors=[],items=[],seen=new Set();rows.forEach((r,i)=>{const [ni,na,gi,wi,si]=cols;const id=(r[ni]||'').toUpperCase(),name=(r[na]||'').trim(),g=(r[gi]||'').trim(),w=(r[wi]||'').trim();if(!/^[A-Z0-9_-]{1,32}$/.test(id)||!name){errors.push('Rad '+(i+2)+': ugyldig nummer/navn');return}if(seen.has(id)||db.tools.some(t=>t.id===id)||db.deletedIds.includes(id)){errors.push('Rad '+(i+2)+': duplikat '+id);return}seen.add(id);const group=db.groups.find(x=>x.id.toLowerCase()===g.toLowerCase()||x.name.toLowerCase()===g.toLowerCase());const wh=db.warehouses.find(x=>x.id.toLowerCase()===w.toLowerCase()||x.name.toLowerCase()===w.toLowerCase());if(!group||!wh){errors.push('Rad '+(i+2)+': ukjent gruppe/lager');return}items.push({id,name,group:group.id,warehouse:wh.id,serial:(r[si]||'').trim(),holder:null,caseId:null,condition:'active',conditionNote:'',qrId:'TOOL-'+crypto.randomUUID(),qrMarked:false})});if(errors.length)return alert('Import avbrutt. Ingen data endret.\n'+errors.slice(0,12).join('\n')+(errors.length>12?'\n...':' '));if(!items.length)return alert('Ingen verktøy å importere.');if(!confirm('Importere '+items.length+' verktøy og generere QR-koder?'))return;db.tools.push(...items);log('CSV-import',items.length+' verktøy');save();render();alert(items.length+' verktøy importert. Skriv ut etiketter fra verktøyfanen.')}
function printAllCodes(){printCodes(db.tools.filter(t=>t.condition!=='retired'))}
function printUnmarkedCodes(){printCodes(db.tools.filter(t=>t.condition!=='retired'&&!t.qrMarked))}
function printCodes(tools){if(!tools.length)return alert('Ingen verktøy å skrive ut.');if(tools.length>500&&!confirm('Skrive ut '+tools.length+' etiketter?'))return;const w=window.open('','_blank');if(!w)return alert('Tillat popup-vinduer.');const cards=tools.map(t=>`<div class="tag"><strong>${esc(t.name)}</strong><img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(t.qrId)}"><b>${esc(t.id)}</b></div>`).join('');w.document.write(`<html><head><meta charset="utf-8"><title>QR-etiketter</title><style>body{font:13px Arial}.sheet{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tag{border:1px dashed #aaa;display:flex;align-items:center;flex-direction:column;padding:8px;break-inside:avoid}.tag img{width:130px;height:130px}.tag strong{font-size:11px}button{margin:12px}@media print{button{display:none}}</style></head><body><button onclick="print()">Skriv ut</button><p>QR-bildene krever internett ved generering. Kontroller utskriften før merking.</p><div class="sheet">${cards}</div></body></html>`);w.document.close()}

function addCase(e){e.preventDefault();const f=e.target;const c={id:uid('K',db.cases),name:f.elements.name.value.trim(),warehouse:f.elements.warehouse.value,holder:null};db.cases.push(c);log('Kasse opprettet',c.name+' ('+c.id+')');save();render()}
function manageCase(id){const c=db.cases.find(x=>x.id===id);if(!c||c.holder)return alert('Kassen må være på lager før innholdet kan endres.');const code=prompt('Skriv verktøynummer (f.eks. V001). Skriv nummeret til et verktøy som allerede er i kassen for å ta det ut.');if(code===null)return;const t=db.tools.find(x=>x.id.toUpperCase()===code.trim().toUpperCase());if(!t)return alert('Fant ikke verktøyet.');if(t.caseId===id){t.caseId=null;log('Verktøy tatt ut av kasse',t.id+' fra '+c.id)}else{if(t.caseId)return alert('Verktøyet ligger allerede i en annen kasse.');if(t.holder)return alert('Verktøyet er utlånt.');if(t.condition!=='active')return alert('Defekt, reparasjon eller utrangert verktøy kan ikke legges i kasse.');if(t.warehouse!==c.warehouse)return alert('Verktøy og kasse må tilhøre samme lager.');t.caseId=id;log('Verktøy lagt i kasse',t.id+' i '+c.id)}save();render()}
function checkoutCase(id){const c=db.cases.find(x=>x.id===id);if(!c||c.holder)return alert('Kassen er allerede utlånt.');const ts=db.tools.filter(t=>t.caseId===id);if(!ts.length)return alert('Kassen er tom.');if(ts.some(t=>t.holder))return alert('Et verktøy i kassen er allerede utlånt.');if(ts.some(t=>t.condition!=='active'))return alert('Kassen inneholder defekt, utrangert eller verktøy til reparasjon.');const answer=prompt('Ansattnummer for utlån av '+c.name+' (f.eks. A001):',chosen||'');if(answer===null)return;const p=db.people.find(x=>x.id.toUpperCase()===answer.trim().toUpperCase());if(!p)return alert('Ukjent ansattnummer.');if(!confirmDuplicate(p.id,ts))return;if(!confirm('Lån ut '+c.name+' med '+ts.length+' verktøy til '+p.name+'?'))return;c.holder=p.id;ts.forEach(t=>t.holder=p.id);chosen=p.id;log('Kasse utlevert',c.id+' ('+ts.map(t=>t.id).join(', ')+') → '+p.name);save();render()}
let activeReturnCase=null;
function checkinCase(id){const c=db.cases.find(x=>x.id===id);if(!c||!c.holder)return;activeReturnCase=id;setTab('utlaan');const ts=db.tools.filter(t=>t.caseId===id);$('#result').innerHTML=`<section><h2>QR-returkontroll: ${esc(c.name)} (${esc(c.id)})</h2><p>Utlånt til <b>${esc(person(c.holder))}</b>. Skann QR-koden på <b>hvert enkelt verktøy</b>. Du kan bruke USB-skanner eller mobilkamera. Bare verktøy som hører til kassen godtas.</p><label>Skann verktøykode</label><input id="case-scan" placeholder="F.eks. V001" onkeydown="if(event.key==='Enter'){event.preventDefault();scanCaseItem()}"><div class="actions"><button onclick="scanCaseItem()">Registrer skann</button><button class="alt" onclick="startCamera('case')">📷 Skann med kamera</button></div><p id="case-feedback" class="muted">${ts.length} verktøy skal kontrolleres.</p><div id="case-progress"></div><label>Kommentar til avvik (valgfritt)</label><input id="case-note" placeholder="F.eks. batteri mangler"><div class="actions"><button onclick="confirmCaseReturn('${esc(id)}')">Fullfør returkontroll</button><button class="alt" onclick="activeReturnCase=null;setTab('kasser')">Avbryt</button></div></section>`;updateCaseProgress();$('#case-scan').focus()}
function scanCaseItem(raw){const code=(raw??$('#case-scan')?.value??'').trim().toUpperCase();const c=db.cases.find(x=>x.id===activeReturnCase);const feedback=$('#case-feedback');if(!c||!feedback)return;const t=db.tools.find(x=>x.id.toUpperCase()===code||x.qrId?.toUpperCase()===code||x.serial?.toUpperCase()===code);if(!t||t.caseId!==c.id){feedback.textContent='⚠️ Ukjent verktøy eller verktøyet tilhører ikke denne kassen: '+code;}else{const check=document.querySelector('.case-check[value="'+t.id+'"]');if(check?.checked)feedback.textContent='Allerede skannet: '+t.name+' ('+t.id+')';else{if(check)check.checked=true;(window.caseScanned ||= {});(window.caseScanned[c.id] ||= []).push(t.id);feedback.textContent='✓ Kontrollert: '+t.name+' ('+t.id+')'}}if($('#case-scan')){$('#case-scan').value='';$('#case-scan').focus()}updateCaseProgress()}
function updateCaseProgress(){const c=db.cases.find(x=>x.id===activeReturnCase),target=$('#case-progress');if(!c||!target)return;const ts=db.tools.filter(t=>t.caseId===c.id);target.innerHTML=ts.map(t=>`<label class="item" style="display:flex;gap:12px;align-items:center"><input type="checkbox" class="case-check" value="${esc(t.id)}" disabled style="width:22px;height:22px"><span><b>${esc(t.name)}</b><span class="muted">${esc(t.id)} · ${esc(t.serial||'Uten serienummer')}</span></span></label>`).join('');const found=window.caseScanned?.[c.id]||[];target.querySelectorAll('.case-check').forEach(x=>x.checked=found.includes(x.value));target.insertAdjacentHTML('afterbegin',`<p><b>${found.length} av ${ts.length} skannet</b></p>`)}
function confirmCaseReturn(id){const c=db.cases.find(x=>x.id===id);if(!c||!c.holder)return alert('Kassen er ikke utlånt.');const ts=db.tools.filter(t=>t.caseId===id);const found=new Set(window.caseScanned?.[id]||[]);const missing=ts.filter(t=>!found.has(t.id));const note=($('#case-note')?.value||'').trim();const message=missing.length?`ADVARSEL: ${missing.length} verktøy mangler:\n${missing.map(t=>t.id+' – '+t.name).join('\n')}\n\nFunnet innhold blir levert inn. Manglende verktøy forblir utlånt til ${person(c.holder)}. Bekreft?`:`Alle ${ts.length} verktøy er kontrollert. Godkjenn komplett retur?`;if(!confirm(message))return;const prev=person(c.holder);ts.forEach(t=>{if(found.has(t.id))t.holder=null;else t.caseId=null});c.missing=missing.map(t=>t.id);c.holder=null;log(missing.length?'Kasse returnert med avvik':'Kasse komplett returnert',`${c.id} fra ${prev} · ${found.size} mottatt${missing.length?' · Mangler: '+missing.map(t=>t.id).join(', '):''}${note?' · '+note:''}`);if(window.caseScanned)delete window.caseScanned[id];activeReturnCase=null;save();setTab('kasser');alert(missing.length?'Retur registrert med avvik. Manglende verktøy står fortsatt utlånt.':'Komplett retur registrert.');}
function addConsumable(e){e.preventDefault();const f=e.target;const quantity=Number(f.elements.quantity.value),minimum=Number(f.elements.minimum.value);if(!Number.isSafeInteger(quantity)||quantity<0||!Number.isSafeInteger(minimum)||minimum<0)return alert('Ugyldig antall');const x={id:uid('F',db.consumables),name:f.elements.name.value.trim(),warehouse:f.elements.warehouse.value,unit:f.elements.unit.value,quantity,minimum};db.consumables.push(x);log('Forbruksvare opprettet',x.name+' · '+warehouse(x.warehouse));save();render()}
function changeStock(id,direction){const x=db.consumables.find(y=>y.id===id);if(!x)return;const answer=prompt(direction<0?'Antall som tas ut:':'Antall som fylles på:','1');if(answer===null)return;const n=Number(answer);if(!Number.isSafeInteger(n)||n<1)return alert('Skriv inn et heltall større enn null.');if(direction<0&&n>x.quantity)return alert('Ikke nok på lager.');const personName=prompt('Ansattnummer (valgfritt, f.eks. A001):','');if(personName===null)return;const p=personName.trim()?db.people.find(y=>y.id.toUpperCase()===personName.trim().toUpperCase()):null;if(personName.trim()&&!p)return alert('Ukjent ansattnummer.');x.quantity+=direction*n;log(direction<0?'Forbruksvare tatt ut':'Forbruksvare fylt på',`${x.name} · ${n} ${x.unit} · ${warehouse(x.warehouse)}${p?' · '+p.name:''} · Beholdning: ${x.quantity}`);save();render()}
function addLocation(e){e.preventDefault();const x={id:uid('L',db.locations),name:e.target.elements.name.value.trim()};db.locations.push(x);save();render()}function addWarehouse(e){e.preventDefault();const x={id:uid('W',db.warehouses),name:e.target.elements.name.value.trim(),location:e.target.elements.location.value};db.warehouses.push(x);save();render()}function movePerson(id){const p=db.people.find(x=>x.id===id);const list=db.locations.map((l,i)=>`${i+1}. ${l.name}`).join('\n');const answer=prompt('Velg ny lokasjon for '+p.name+' (nummer):\n'+list);if(answer===null)return;const dest=db.locations[Number(answer)-1];if(!dest)return alert('Ugyldig lokasjon');const borrowed=db.tools.filter(t=>t.holder===id&&db.warehouses.find(w=>w.id===t.warehouse)?.location!==dest.id);if(borrowed.length&&!confirm('ADVARSEL: '+p.name+' har '+borrowed.length+' utlånte verktøy fra andre lokasjoner:\n'+borrowed.map(t=>t.name+' ('+warehouse(t.warehouse)+')').join('\n')+'\n\nBekreft flytting?'))return;const from=loc(p.location);p.location=dest.id;log('Ansatt flyttet',`${p.name}: ${from} → ${dest.name}${borrowed.length?' · '+borrowed.length+' verktøy fra andre lager':''}`);save();render()}function selectTool(id){$('#toolcode').value=id;processTool()}function processTool(){const code=$('#toolcode').value.trim().toUpperCase();const c=db.cases.find(x=>x.id.toUpperCase()===code);if(c){const box=$('#result');box.innerHTML=`<div class="card"><h3>🧰 ${esc(c.name)} (${esc(c.id)})</h3><p>${db.tools.filter(t=>t.caseId===c.id).length} verktøy · ${c.holder?'Utlånt til '+esc(person(c.holder)):'På lager'}</p><button onclick="${c.holder?'checkinCase':'checkoutCase'}('${c.id}')">${c.holder?'Kontroller retur':'Lån ut hele kassen'}</button></div>`;return}const t=db.tools.find(x=>x.id.toUpperCase()===code||(x.qrId||'').toUpperCase()===code||(x.serial||'').toUpperCase()===code);const box=$('#result');if(!t){box.innerHTML='<p class="notice">Fant ikke verktøyet. Kontroller koden.</p>';return}chosen=$('#employee').value||chosen;box.innerHTML=`<div class="card"><h3>${esc(t.name)} (${esc(t.id)})</h3><p>Fast lager: <b>${esc(warehouse(t.warehouse))}</b></p><p>Status: <b>${t.condition==='retired'?'Utrangert':t.condition==='broken'?'Defekt':t.condition==='repair'?'Til reparasjon':t.holder?'Utlånt til '+esc(person(t.holder)):'På lager'}</b></p><div class="actions">${t.holder?`<button onclick="checkin('${t.id}')">Registrer innlevering</button>`:t.condition==='active'?`<button onclick="checkout('${t.id}')">Registrer utlån til valgt ansatt</button>`:'<p class="notice">Sperret for utlån</p>'}</div></div>`}function checkout(id){const t=db.tools.find(x=>x.id===id),pid=$('#employee').value;if(!pid)return alert('Velg eller skann ansatt først.');if(t.holder)return alert('Verktøyet er allerede utlånt');if(t.condition!=='active')return alert('Verktøyet er sperret for utlån: '+({broken:'Defekt',repair:'Til reparasjon',retired:'Utrangert'}[t.condition]||t.condition));if(t.caseId)return alert('Verktøyet ligger i en kasse. Lån ut kassen med kassekoden.');if(!confirmDuplicate(pid,[t]))return;t.holder=pid;log('Utlevering',`${t.name} → ${person(pid)} · ${warehouse(t.warehouse)}`);chosen=pid;save();render();$('#toolcode').value=id;processTool()}function checkin(id){const t=db.tools.find(x=>x.id===id);if(!t.holder)return;if(t.caseId)return alert('Dette verktøyet er del av en kasse. Lever inn hele kassen.');const prev=person(t.holder);if(!confirm('Bekreft innlevering av '+t.name+' fra '+prev+'?'))return;t.holder=null;log('Innlevering',`${t.name} ← ${prev}`);save();render();$('#toolcode').value=id;processTool()}
function printCode(id){const x=db.people.find(p=>p.id===id)||db.tools.find(t=>t.id===id)||db.cases.find(c=>c.id===id);if(!x)return;const w=window.open('','_blank');if(!w){alert('Tillat popup-vinduer for utskrift.');return}const title=x.name;w.document.write(`<html><head><meta charset="utf-8"><title>QR-kort ${esc(id)}</title><meta name="theme-color" content="#14263d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>body{font:18px system-ui;text-align:center;padding:35px}img{width:240px;height:240px}small{display:block;color:#666;margin:10px}</style></head><body><h2>${esc(title)}</h2><img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(x.qrId||id)}" alt="QR-kode"><h2>${esc(id)}</h2><small>QR-bildet krever internett ved generering. Koden kan også skrives manuelt.</small><button onclick="print()">Skriv ut</button></body></html>`);w.document.close()}
let qrScanner=null,scannerStarting=false;
async function loadQrLibrary(){
 if(window.Html5Qrcode)return;
 if(!window.qrLibraryPromise){window.qrLibraryPromise=new Promise((resolve,reject)=>{
 const script=document.createElement('script');script.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
 script.onload=()=>window.Html5Qrcode?resolve():reject(new Error('QR-biblioteket ble ikke lastet'));
 script.onerror=()=>reject(new Error('QR-biblioteket kunne ikke lastes. Koble til internett og prøv igjen.'));
 document.head.appendChild(script);
 }).catch(e=>{window.qrLibraryPromise=null;throw e})}
 await window.qrLibraryPromise;
}
async function startCamera(target){
 if(scannerStarting)return;
 await stopCamera();scanTarget=target;
 const el=$('#scanner');if(!el)return;
 el.classList.remove('hidden');
 const status=$('#camera-status');if(status)status.textContent='Starter kamera …';
 scannerStarting=true;
 try{
 if(!window.isSecureContext||!navigator.mediaDevices?.getUserMedia)throw new Error('Kamera krever HTTPS og kameratilgang i Safari.');
 await loadQrLibrary();
 if(!$('#qr-reader'))return;
 const scanner=new Html5Qrcode('qr-reader',{verbose:false});qrScanner=scanner;
 await scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>{const n=Math.min(260,w-20,h-20);return {width:Math.max(100,n),height:Math.max(100,n)}}},async decoded=>{
 if(qrScanner!==scanner)return;
 const targetAtScan=scanTarget;
 await stopCamera();
 const code=String(decoded||'').trim();
 if(targetAtScan==='case'){scanCaseItem(code)}
 else if(targetAtScan==='lookup'){const p=db.people.find(x=>x.id.toUpperCase()===code.toUpperCase());if(p)showPerson(p.id);else alert('Fant ikke ansatt: '+code)}
 else if(targetAtScan==='person'){
 const p=db.people.find(x=>x.id.toUpperCase()===code.toUpperCase());
 if(p){chosen=p.id;const employee=$('#employee');if(employee)employee.value=p.id;}
 else alert('Fant ikke ansatt: '+code);
 }else{const input=$('#toolcode');if(input){input.value=code;processTool()}}
 },()=>{});
 if(status)status.textContent='Kamera klart – hold QR-koden innenfor rammen.';
 }catch(e){if(status)status.textContent='Kunne ikke starte skanning: '+(e?.message||e);await stopCamera(false)}
 finally{scannerStarting=false}
}
async function stopCamera(hide=true){
 const scanner=qrScanner;qrScanner=null;
 if(scanner){try{if(scanner.isScanning)await scanner.stop()}catch(e){}try{scanner.clear()}catch(e){}}
 const el=$('#scanner');if(el&&hide)el.classList.add('hidden');
}
