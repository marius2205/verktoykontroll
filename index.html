<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verktøykontroll – test</title><meta name="theme-color" content="#14263d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{font:15px system-ui,sans-serif;color:#1d2939;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#14263d;color:white;padding:20px max(16px,calc((100vw - 1100px)/2))}header h1{margin:0;font-size:25px}header p{margin:5px 0;color:#b8cadc}main{max-width:1100px;margin:20px auto;padding:0 14px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}button{border:0;border-radius:9px;padding:11px 14px;background:#2365a8;color:white;cursor:pointer;font:inherit}button.alt{background:#e6edf5;color:#20344a}button.warn{background:#ad493b}button:disabled{opacity:.5;cursor:not-allowed}.nav button.active{background:#14263d}section{background:white;border:1px solid #dce5ef;border-radius:14px;padding:18px;margin:0 0 16px}h2{font-size:19px;margin:0 0 15px}h3{font-size:16px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#eef4fa;padding:15px;border-radius:10px}.stat b{font-size:28px;display:block}.muted{color:#65758a;font-size:13px}input,select{width:100%;padding:11px;border:1px solid #cbd6e2;border-radius:8px;font:inherit;background:white}label{display:block;font-size:13px;font-weight:600;margin:9px 0 4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{padding:12px 0;border-bottom:1px solid #e6edf4;display:flex;align-items:center;justify-content:space-between;gap:10px}.item:last-child{border:0}.item b{display:block}.pill{display:inline-block;background:#e7f5ec;color:#12643d;border-radius:12px;padding:3px 8px;font-size:12px}.pill.out{background:#fff0da;color:#995500}.notice{background:#fff2d8;padding:12px;border-radius:9px;color:#76500e}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.hidden{display:none!important}#scanner video{width:100%;max-height:300px;background:black;border-radius:10px}.qr{width:110px;height:110px;object-fit:contain;background:white}.card{border:1px solid #dce5ef;border-radius:10px;padding:12px;margin:8px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}.smallbtn{padding:7px 10px;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:10px}.stat b{font-size:22px}.item{align-items:flex-start}}
@media print{header,.nav,.no-print,button{display:none!important}main{margin:0}.card{break-inside:avoid}}
</style></head><body><header><h1>🔧 Verktøykontroll</h1><p>Testversjon 0.7 · Mobiltest · Lokal lagring · Offline</p></header><main><div class="nav" id="nav"></div><div id="app"></div></main><script>
const KEY='verktoykontroll-demo-v02';const seed=()=>({locations:[{id:'L1',name:'Sandnessjøen'},{id:'L2',name:'Mosjøen'}],departments:['Verksted','Vedlikehold','Produksjon'],warehouses:[{id:'W1',name:'Hovedlager',location:'L1'},{id:'W2',name:'Delelager',location:'L2'}],people:[{id:'A001',name:'Ola Hansen',location:'L1',department:'Verksted'},{id:'A002',name:'Kari Nilsen',location:'L2',department:'Vedlikehold'}],tools:[{id:'V001',name:'DeWalt drill',serial:'DW-123',warehouse:'W1',holder:null},{id:'V002',name:'DeWalt muttertrekker',serial:'DW-456',warehouse:'W1',holder:'A001'},{id:'V003',name:'Bosch borhammer',serial:'BO-789',warehouse:'W2',holder:null}],groups:[{id:'G001',name:'Driller'},{id:'G002',name:'Muttertrekkere'},{id:'G003',name:'Borhammere'}],events:[]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()} db.groups ||= []; db.cases ||= []; db.cases.forEach(c=>{c.missing ||= []}); db.tools.forEach(t=>{if(!('caseId' in t))t.caseId=null}); db.tools.forEach(t=>{if(!('group' in t)){const gn=t.name.toLowerCase().includes('mutter')?'Muttertrekkere':t.name.toLowerCase().includes('borhammer')?'Borhammere':'Driller';let g=db.groups.find(g=>g.name===gn);if(!g){g={id:'G'+String(db.groups.length+1).padStart(3,'0'),name:gn};db.groups.push(g)}t.group=g.id}});let openGroups={};let tab='oversikt',chosen=null,scanTarget='tool',stream=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(db));save();const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const name=(list,id)=>list.find(x=>x.id===id)?.name||id||'—';const person=id=>name(db.people,id);const loc=id=>name(db.locations,id);const warehouse=id=>name(db.warehouses,id);const date=()=>new Date().toLocaleString('no-NO');const log=(action,detail)=>db.events.unshift({date:date(),action,detail});const uid=(prefix,arr)=>prefix+String(Math.max(0,...arr.map(x=>Number(x.id.slice(1))||0))+1).padStart(3,'0');function setTab(t){stopCamera();tab=t;render()}function nav(){const tabs=[['oversikt','Oversikt'],['utlaan','Utlån / innlevering'],['ansatte','Ansatte'],['verktoy','Verktøy'],['kasser','Verktøykasser'],['lager','Lokasjoner'],['historikk','Historikk']];$('#nav').innerHTML=tabs.map(([id,n])=>`<button class="${tab===id?'active':'alt'}" onclick="setTab('${id}')">${n}</button>`).join('')}function opts(arr,current){return arr.map(x=>`<option value="${esc(x.id)}" ${x.id===current?'selected':''}>${esc(x.name)}</option>`).join('')}function render(){nav();let h='';if(tab==='oversikt')h=`<section><h2>Dashboard</h2><div class="stats"><div class="stat"><b>${db.tools.length}</b>Verktøy</div><div class="stat"><b>${db.tools.filter(t=>t.holder).length}</b>Utlånt</div><div class="stat"><b>${db.tools.filter(t=>!t.holder).length}</b>På lager</div></div><p class="notice">Testmodus: Alt lagres kun i denne nettleseren. Ingen ekte innlogging, felles database eller synkronisering er aktivert.</p><div class="actions"><button onclick="setTab('utlaan')">Start skanning</button><button class="alt" onclick="exportData()">Eksporter sikkerhetskopi</button></div></section><section><h2>Siste bevegelser</h2>${history(5)}</section>`;
if(tab==='utlaan')h=`<section><h2>Registrer utlån eller innlevering</h2><div class="grid"><div><label>Skann ansattkort eller velg ansatt</label><select id="employee"><option value="">Velg ansatt</option>${opts(db.people,chosen)}</select><div class="actions"><button class="alt" onclick="startCamera('person')">📷 Skann ansatt-QR</button></div></div><div><label>Skann verktøy eller skriv verktøykode</label><input id="toolcode" placeholder="F.eks. V001" onkeydown="if(event.key==='Enter')processTool()"><div class="actions"><button class="alt" onclick="startCamera('tool')">📷 Skann verktøy-QR</button><button onclick="processTool()">Finn verktøy</button></div></div></div><div id="scanner" class="hidden"><h3>Kameraskanning</h3><video id="video" autoplay playsinline></video><div class="actions"><button class="alt" onclick="stopCamera()">Stopp kamera</button></div><p class="muted">Krever HTTPS eller localhost og en nettleser med QR-støtte. Manuell kode fungerer alltid.</p></div><div id="result"></div></section><section><h2>Verktøy med status</h2>${toolRows(true)}</section>`;
if(tab==='ansatte')h=`<section><h2>Ansattregister og QR-kort</h2><form onsubmit="addPerson(event)"><div class="grid"><div><label>Navn</label><input name="name" required placeholder="Fornavn Etternavn"></div><div><label>Lokasjon</label><select name="location">${opts(db.locations)}</select></div><div><label>Avdeling</label><select name="department">${db.departments.map(d=>`<option>${esc(d)}</option>`).join('')}</select></div></div><div class="actions"><button>Legg til ansatt</button></div></form></section><section><h2>Ansatte (${db.people.length})</h2>${db.people.map(p=>`<div class="card"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.id)} · ${esc(loc(p.location))} · ${esc(p.department)}</div><div class="muted">${db.tools.filter(t=>t.holder===p.id).length} verktøy utlånt</div></div><button class="alt right smallbtn" onclick="printCode('${p.id}')">Vis / skriv ut QR</button><button class="alt smallbtn" onclick="movePerson('${p.id}')">Flytt</button></div></div>`).join('')}</section>`;
if(tab==='verktoy')h=`<section><h2>Verktøygrupper</h2><form onsubmit="addGroup(event)"><div class="grid"><div><label>Ny gruppe</label><input name="name" required placeholder="F.eks. Vinkelslipere"></div><div style="align-self:end"><button>Opprett gruppe</button></div></div></form><p class="muted">Samle like verktøy i en gruppe. Hvert verktøy får fortsatt sin egen ID og QR-kode.</p></section><section><h2>Registrer ett eller flere verktøy</h2><form onsubmit="addTool(event)"><div class="grid"><div><label>Gruppe</label><select name="group" required><option value="">Velg gruppe</option>${opts(db.groups)}</select></div><div><label>Navn / modell</label><input name="name" required placeholder="DeWalt DCG405"></div><div><label>Antall</label><input name="quantity" type="number" min="1" max="100" value="1" required></div><div><label>Serienummer (kun ved antall 1)</label><input name="serial" placeholder="Valgfritt"></div><div><label>Fast lager</label><select name="warehouse">${opts(db.warehouses)}</select></div></div><div class="actions"><button>Registrer verktøy</button></div></form></section><section><h2>Verktøy etter gruppe</h2>${toolRows(false)}</section>`;
if(tab==='kasser')h=`<section><h2>Verktøykasser</h2><p class="muted">Opprett en kasse, legg verktøy i den og lån ut hele kassen med én QR-kode. Hvert verktøy beholder sin egen ID og historikk. Verktøy fra forskjellige lager kan ikke blandes i samme kasse.</p><form onsubmit="addCase(event)"><div class="grid"><div><label>Navn på kasse</label><input name="name" required placeholder="F.eks. Vinkelsliper-kasse 1"></div><div><label>Fast lager</label><select name="warehouse">${opts(db.warehouses)}</select></div></div><div class="actions"><button>Opprett verktøykasse</button></div></form></section><section><h2>Registrerte kasser (${db.cases.length})</h2>${db.cases.map(c=>{const ts=db.tools.filter(t=>t.caseId===c.id);return `<div class="card"><div class="row"><div><b>🧰 ${esc(c.name)} (${esc(c.id)})</b><div class="muted">${esc(warehouse(c.warehouse))} · ${ts.length} verktøy · ${c.holder?'Utlånt til '+esc(person(c.holder)):'På lager'}</div></div><button class="alt smallbtn" onclick="printCode('${c.id}')">QR-kode</button></div><div class="actions"><button class="alt smallbtn" onclick="manageCase('${c.id}')">Legg til / fjern verktøy</button>${c.holder?`<button onclick="checkinCase('${c.id}')">Kontroller retur</button>`:`<button onclick="checkoutCase('${c.id}')">Lån ut hele kassen</button>`}</div>${c.missing?.length?`<p class="notice">Siste retur hadde avvik: ${c.missing.map(esc).join(', ')}</p>`:''}${ts.map(t=>`<div class="item"><span>${esc(t.name)} · ${esc(t.id)}</span><span class="muted">${t.holder?'Utlånt':'På lager'}</span></div>`).join('')}</div>`}).join('')||'<p class="muted">Ingen kasser registrert.</p>'}</section>`;
if(tab==='forbruk')h=`<section><h2>Forbrukslager</h2><p class="muted">Lagerbeholdning per lager. Uttak og påfyll loggføres. Varer under minimum vises med varsel.</p><form onsubmit="addConsumable(event)"><div class="grid"><div><label>Varenavn</label><input name="name" required placeholder="F.eks. Slipeskive 125 mm"></div><div><label>Lager</label><select name="warehouse">${opts(db.warehouses)}</select></div><div><label>Enhet</label><select name="unit"><option>stk</option><option>pakker</option><option>meter</option><option>liter</option></select></div><div><label>Startbeholdning</label><input name="quantity" type="number" min="0" step="1" value="0" required></div><div><label>Minimumsbeholdning</label><input name="minimum" type="number" min="0" step="1" value="10" required></div></div><div class="actions"><button>Opprett forbruksvare</button></div></form></section><section><h2>Lagerstatus</h2>${db.consumables.map(x=>`<div class="card"><div class="row"><div><b>${esc(x.name)} (${esc(x.id)})</b><div class="muted">${esc(warehouse(x.warehouse))} · Minimum ${x.minimum} ${esc(x.unit)}</div></div><div><b>${x.quantity} ${esc(x.unit)}</b> ${x.quantity<=x.minimum?'<span class="pill out">Bestill mer</span>':'<span class="pill">På lager</span>'}</div></div><div class="actions"><button class="alt smallbtn" onclick="changeStock('${x.id}',-1)">Ta ut</button><button class="alt smallbtn" onclick="changeStock('${x.id}',1)">Fyll på</button><button class="alt smallbtn" onclick="printCode('${x.id}')">QR-kode</button></div></div>`).join('')||'<p>Ingen forbruksvarer registrert.</p>'}</section>`;
if(tab==='lager')h=`<section><h2>Lokasjoner og faste lager</h2>${db.locations.map(l=>`<div class="card"><b>${esc(l.name)}</b><div class="muted">${db.warehouses.filter(w=>w.location===l.id).map(w=>w.name).join(', ')||'Ingen lager'}</div></div>`).join('')}<h3>Legg til lokasjon</h3><form onsubmit="addLocation(event)"><input name="name" required placeholder="Navn på lokasjon"><div class="actions"><button>Opprett lokasjon</button></div></form><h3>Legg til lager</h3><form onsubmit="addWarehouse(event)"><div class="grid"><input name="name" required placeholder="Lagernavn"><select name="location">${opts(db.locations)}</select></div><div class="actions"><button>Opprett lager</button></div></form><p class="muted">Verktøyets faste lager kan ikke endres i denne testversjonen. Ansatte kan flyttes mellom lokasjoner.</p></section>`;
if(tab==='historikk')h=`<section><h2>Hendelseslogg</h2>${history(100)}</section><section><h2>Testdata og sikkerhetskopi</h2><div class="actions"><button class="alt" onclick="exportData()">Eksporter JSON</button><button class="warn" onclick="resetDemo()">Nullstill testdata</button></div></section>`;$('#app').innerHTML=h; if(tab==='utlaan'&&chosen)$('#employee').value=chosen}function history(n){return db.events.slice(0,n).map(e=>`<div class="item"><div><b>${esc(e.action)}</b><span class="muted">${esc(e.detail)} · ${esc(e.date)}</span></div></div>`).join('')||'<p class="muted">Ingen registreringer ennå.</p>'}function toggleGroup(id){openGroups[id]=!(openGroups[id]??true);render()}function toolRows(compact){const groups=[...db.groups,{id:'_none',name:'Uten gruppe'}].filter(g=>db.tools.some(t=>(t.group||'_none')===g.id));return groups.map(g=>{const items=db.tools.filter(t=>(t.group||'_none')===g.id),out=items.filter(t=>t.holder).length,expanded=openGroups[g.id]??true;return `<div class="card"><div class="row" style="cursor:pointer" onclick="toggleGroup('${g.id}')"><div><b>📁 ${esc(g.name)}</b><div class="muted">${items.length} totalt · ${items.length-out} på lager · ${out} utlånt</div></div><button type="button" class="alt smallbtn right">${expanded?'Skjul ▲':'Vis ▼'}</button></div>${expanded?items.map(t=>`<div class="item"><div><b>${esc(t.name)} <span class="pill ${t.holder?'out':''}">${t.holder?'Utlånt':'På lager'}</span></b><span class="muted">${esc(t.id)} · ${esc(warehouse(t.warehouse))} · ${t.holder?'Hos '+esc(person(t.holder)):'Tilgjengelig'}${t.serial?' · SN '+esc(t.serial):''}</span></div><div class="actions">${compact?`<button class="alt smallbtn" onclick="selectTool('${t.id}')">Velg</button>`:`<button class="alt smallbtn" onclick="printCode('${t.id}')">QR-kode</button>`}</div></div>`).join(''):''}</div>`}).join('')||'<p>Ingen verktøy.</p>'}function addGroup(e){e.preventDefault();const n=e.target.elements.name.value.trim();if(db.groups.some(g=>g.name.toLowerCase()===n.toLowerCase()))return alert('Gruppen finnes allerede.');const g={id:uid('G',db.groups),name:n};db.groups.push(g);log('Verktøygruppe opprettet',n);save();render()}
function addPerson(e){e.preventDefault();const f=e.target;const p={id:uid('A',db.people),name:f.elements.name.value.trim(),location:f.elements.location.value,department:f.elements.department.value};db.people.push(p);log('Ansatt opprettet',p.name);save();render()}function addTool(e){e.preventDefault();const f=e.target;const q=Number(f.elements.quantity.value);if(!Number.isInteger(q)||q<1||q>100)return alert('Velg 1–100 verktøy.');const group=f.elements.group.value;if(!db.groups.some(g=>g.id===group))return alert('Velg en gruppe.');const n=f.elements.name.value.trim(),wh=f.elements.warehouse.value,serial=f.elements.serial.value.trim();if(q>1&&serial&&!confirm('Serienummeret blir ikke brukt ved masseregistrering. Fortsette?'))return;for(let i=0;i<q;i++){db.tools.push({id:uid('V',db.tools),name:n,serial:q===1?serial:'',warehouse:wh,group,holder:null})}log('Verktøy registrert',`${q} × ${n} (${name(db.groups,group)})`);save();render()}
function addCase(e){e.preventDefault();const f=e.target;const c={id:uid('K',db.cases),name:f.elements.name.value.trim(),warehouse:f.elements.warehouse.value,holder:null};db.cases.push(c);log('Kasse opprettet',c.name+' ('+c.id+')');save();render()}
function manageCase(id){const c=db.cases.find(x=>x.id===id);if(!c||c.holder)return alert('Kassen må være på lager før innholdet kan endres.');const code=prompt('Skriv verktøynummer (f.eks. V001). Skriv nummeret til et verktøy som allerede er i kassen for å ta det ut.');if(code===null)return;const t=db.tools.find(x=>x.id.toUpperCase()===code.trim().toUpperCase());if(!t)return alert('Fant ikke verktøyet.');if(t.caseId===id){t.caseId=null;log('Verktøy tatt ut av kasse',t.id+' fra '+c.id)}else{if(t.caseId)return alert('Verktøyet ligger allerede i en annen kasse.');if(t.holder)return alert('Verktøyet er utlånt.');if(t.warehouse!==c.warehouse)return alert('Verktøy og kasse må tilhøre samme lager.');t.caseId=id;log('Verktøy lagt i kasse',t.id+' i '+c.id)}save();render()}
function checkoutCase(id){const c=db.cases.find(x=>x.id===id);if(!c||c.holder)return alert('Kassen er allerede utlånt.');const ts=db.tools.filter(t=>t.caseId===id);if(!ts.length)return alert('Kassen er tom.');if(ts.some(t=>t.holder))return alert('Et verktøy i kassen er allerede utlånt.');const answer=prompt('Ansattnummer for utlån av '+c.name+' (f.eks. A001):',chosen||'');if(answer===null)return;const p=db.people.find(x=>x.id.toUpperCase()===answer.trim().toUpperCase());if(!p)return alert('Ukjent ansattnummer.');if(!confirm('Lån ut '+c.name+' med '+ts.length+' verktøy til '+p.name+'?'))return;c.holder=p.id;ts.forEach(t=>t.holder=p.id);chosen=p.id;log('Kasse utlevert',c.id+' ('+ts.map(t=>t.id).join(', ')+') → '+p.name);save();render()}
let activeReturnCase=null;
function checkinCase(id){const c=db.cases.find(x=>x.id===id);if(!c||!c.holder)return;activeReturnCase=id;setTab('utlaan');const ts=db.tools.filter(t=>t.caseId===id);$('#result').innerHTML=`<section><h2>QR-returkontroll: ${esc(c.name)} (${esc(c.id)})</h2><p>Utlånt til <b>${esc(person(c.holder))}</b>. Skann QR-koden på <b>hvert enkelt verktøy</b>. Du kan bruke USB-skanner eller mobilkamera. Bare verktøy som hører til kassen godtas.</p><label>Skann verktøykode</label><input id="case-scan" placeholder="F.eks. V001" onkeydown="if(event.key==='Enter'){event.preventDefault();scanCaseItem()}"><div class="actions"><button onclick="scanCaseItem()">Registrer skann</button><button class="alt" onclick="startCamera('case')">📷 Skann med kamera</button></div><p id="case-feedback" class="muted">${ts.length} verktøy skal kontrolleres.</p><div id="case-progress"></div><label>Kommentar til avvik (valgfritt)</label><input id="case-note" placeholder="F.eks. batteri mangler"><div class="actions"><button onclick="confirmCaseReturn('${esc(id)}')">Fullfør returkontroll</button><button class="alt" onclick="activeReturnCase=null;setTab('kasser')">Avbryt</button></div></section>`;updateCaseProgress();$('#case-scan').focus()}
function scanCaseItem(raw){const code=(raw??$('#case-scan')?.value??'').trim().toUpperCase();const c=db.cases.find(x=>x.id===activeReturnCase);const feedback=$('#case-feedback');if(!c||!feedback)return;const t=db.tools.find(x=>x.id.toUpperCase()===code||x.serial?.toUpperCase()===code);if(!t||t.caseId!==c.id){feedback.textContent='⚠️ Ukjent verktøy eller verktøyet tilhører ikke denne kassen: '+code;}else{const check=document.querySelector('.case-check[value="'+t.id+'"]');if(check?.checked)feedback.textContent='Allerede skannet: '+t.name+' ('+t.id+')';else{if(check)check.checked=true;(window.caseScanned ||= {});(window.caseScanned[c.id] ||= []).push(t.id);feedback.textContent='✓ Kontrollert: '+t.name+' ('+t.id+')'}}if($('#case-scan')){$('#case-scan').value='';$('#case-scan').focus()}updateCaseProgress()}
function updateCaseProgress(){const c=db.cases.find(x=>x.id===activeReturnCase),target=$('#case-progress');if(!c||!target)return;const ts=db.tools.filter(t=>t.caseId===c.id);target.innerHTML=ts.map(t=>`<label class="item" style="display:flex;gap:12px;align-items:center"><input type="checkbox" class="case-check" value="${esc(t.id)}" disabled style="width:22px;height:22px"><span><b>${esc(t.name)}</b><span class="muted">${esc(t.id)} · ${esc(t.serial||'Uten serienummer')}</span></span></label>`).join('');const found=window.caseScanned?.[c.id]||[];target.querySelectorAll('.case-check').forEach(x=>x.checked=found.includes(x.value));target.insertAdjacentHTML('afterbegin',`<p><b>${found.length} av ${ts.length} skannet</b></p>`)}
function confirmCaseReturn(id){const c=db.cases.find(x=>x.id===id);if(!c||!c.holder)return alert('Kassen er ikke utlånt.');const ts=db.tools.filter(t=>t.caseId===id);const found=new Set(window.caseScanned?.[id]||[]);const missing=ts.filter(t=>!found.has(t.id));const note=($('#case-note')?.value||'').trim();const message=missing.length?`ADVARSEL: ${missing.length} verktøy mangler:\n${missing.map(t=>t.id+' – '+t.name).join('\n')}\n\nFunnet innhold blir levert inn. Manglende verktøy forblir utlånt til ${person(c.holder)}. Bekreft?`:`Alle ${ts.length} verktøy er kontrollert. Godkjenn komplett retur?`;if(!confirm(message))return;const prev=person(c.holder);ts.forEach(t=>{if(found.has(t.id))t.holder=null;else t.caseId=null});c.missing=missing.map(t=>t.id);c.holder=null;log(missing.length?'Kasse returnert med avvik':'Kasse komplett returnert',`${c.id} fra ${prev} · ${found.size} mottatt${missing.length?' · Mangler: '+missing.map(t=>t.id).join(', '):''}${note?' · '+note:''}`);if(window.caseScanned)delete window.caseScanned[id];activeReturnCase=null;save();setTab('kasser');alert(missing.length?'Retur registrert med avvik. Manglende verktøy står fortsatt utlånt.':'Komplett retur registrert.');}
function addConsumable(e){e.preventDefault();const f=e.target;const quantity=Number(f.elements.quantity.value),minimum=Number(f.elements.minimum.value);if(!Number.isSafeInteger(quantity)||quantity<0||!Number.isSafeInteger(minimum)||minimum<0)return alert('Ugyldig antall');const x={id:uid('F',db.consumables),name:f.elements.name.value.trim(),warehouse:f.elements.warehouse.value,unit:f.elements.unit.value,quantity,minimum};db.consumables.push(x);log('Forbruksvare opprettet',x.name+' · '+warehouse(x.warehouse));save();render()}
function changeStock(id,direction){const x=db.consumables.find(y=>y.id===id);if(!x)return;const answer=prompt(direction<0?'Antall som tas ut:':'Antall som fylles på:','1');if(answer===null)return;const n=Number(answer);if(!Number.isSafeInteger(n)||n<1)return alert('Skriv inn et heltall større enn null.');if(direction<0&&n>x.quantity)return alert('Ikke nok på lager.');const personName=prompt('Ansattnummer (valgfritt, f.eks. A001):','');if(personName===null)return;const p=personName.trim()?db.people.find(y=>y.id.toUpperCase()===personName.trim().toUpperCase()):null;if(personName.trim()&&!p)return alert('Ukjent ansattnummer.');x.quantity+=direction*n;log(direction<0?'Forbruksvare tatt ut':'Forbruksvare fylt på',`${x.name} · ${n} ${x.unit} · ${warehouse(x.warehouse)}${p?' · '+p.name:''} · Beholdning: ${x.quantity}`);save();render()}
function addLocation(e){e.preventDefault();const x={id:uid('L',db.locations),name:e.target.elements.name.value.trim()};db.locations.push(x);save();render()}function addWarehouse(e){e.preventDefault();const x={id:uid('W',db.warehouses),name:e.target.elements.name.value.trim(),location:e.target.elements.location.value};db.warehouses.push(x);save();render()}function movePerson(id){const p=db.people.find(x=>x.id===id);const list=db.locations.map((l,i)=>`${i+1}. ${l.name}`).join('\n');const answer=prompt('Velg ny lokasjon for '+p.name+' (nummer):\n'+list);if(answer===null)return;const dest=db.locations[Number(answer)-1];if(!dest)return alert('Ugyldig lokasjon');const borrowed=db.tools.filter(t=>t.holder===id&&db.warehouses.find(w=>w.id===t.warehouse)?.location!==dest.id);if(borrowed.length&&!confirm('ADVARSEL: '+p.name+' har '+borrowed.length+' utlånte verktøy fra andre lokasjoner:\n'+borrowed.map(t=>t.name+' ('+warehouse(t.warehouse)+')').join('\n')+'\n\nBekreft flytting?'))return;const from=loc(p.location);p.location=dest.id;log('Ansatt flyttet',`${p.name}: ${from} → ${dest.name}${borrowed.length?' · '+borrowed.length+' verktøy fra andre lager':''}`);save();render()}function selectTool(id){$('#toolcode').value=id;processTool()}function processTool(){const code=$('#toolcode').value.trim().toUpperCase();const c=db.cases.find(x=>x.id.toUpperCase()===code);if(c){const box=$('#result');box.innerHTML=`<div class="card"><h3>🧰 ${esc(c.name)} (${esc(c.id)})</h3><p>${db.tools.filter(t=>t.caseId===c.id).length} verktøy · ${c.holder?'Utlånt til '+esc(person(c.holder)):'På lager'}</p><button onclick="${c.holder?'checkinCase':'checkoutCase'}('${c.id}')">${c.holder?'Kontroller retur':'Lån ut hele kassen'}</button></div>`;return}const t=db.tools.find(x=>x.id.toUpperCase()===code||x.serial.toUpperCase()===code);const box=$('#result');if(!t){box.innerHTML='<p class="notice">Fant ikke verktøyet. Kontroller koden.</p>';return}chosen=$('#employee').value||chosen;box.innerHTML=`<div class="card"><h3>${esc(t.name)} (${esc(t.id)})</h3><p>Fast lager: <b>${esc(warehouse(t.warehouse))}</b></p><p>Status: <b>${t.holder?'Utlånt til '+esc(person(t.holder)):'På lager'}</b></p><div class="actions">${t.holder?`<button onclick="checkin('${t.id}')">Registrer innlevering</button>`:`<button onclick="checkout('${t.id}')">Registrer utlån til valgt ansatt</button>`}</div></div>`}function checkout(id){const t=db.tools.find(x=>x.id===id),pid=$('#employee').value;if(!pid)return alert('Velg eller skann ansatt først.');if(t.holder)return alert('Verktøyet er allerede utlånt');if(t.caseId)return alert('Verktøyet ligger i en kasse. Lån ut kassen med kassekoden.');t.holder=pid;log('Utlevering',`${t.name} → ${person(pid)} · ${warehouse(t.warehouse)}`);chosen=pid;save();render();$('#toolcode').value=id;processTool()}function checkin(id){const t=db.tools.find(x=>x.id===id);if(!t.holder)return;if(t.caseId)return alert('Dette verktøyet er del av en kasse. Lever inn hele kassen.');const prev=person(t.holder);if(!confirm('Bekreft innlevering av '+t.name+' fra '+prev+'?'))return;t.holder=null;log('Innlevering',`${t.name} ← ${prev}`);save();render();$('#toolcode').value=id;processTool()}
function printCode(id){const x=db.people.find(p=>p.id===id)||db.tools.find(t=>t.id===id)||db.cases.find(c=>c.id===id);if(!x)return;const w=window.open('','_blank');if(!w){alert('Tillat popup-vinduer for utskrift.');return}const title=x.name;w.document.write(`<html><head><meta charset="utf-8"><title>QR-kort ${esc(id)}</title><meta name="theme-color" content="#14263d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>body{font:18px system-ui;text-align:center;padding:35px}img{width:240px;height:240px}small{display:block;color:#666;margin:10px}</style></head><body><h2>${esc(title)}</h2><img src="https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=${encodeURIComponent(id)}" alt="QR-kode"><h2>${esc(id)}</h2><small>QR-bildet krever internett ved generering. Koden kan også skrives manuelt.</small><button onclick="print()">Skriv ut</button></body></html>`);w.document.close()}
let cameraLoop=null;async function startCamera(target){scanTarget=target;const el=$('#scanner');el.classList.remove('hidden');if(!navigator.mediaDevices?.getUserMedia||!('BarcodeDetector'in window)){el.insertAdjacentHTML('beforeend','<p class="notice">Kameraskanning støttes ikke i denne nettleseren. Skriv inn koden manuelt.</p>');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('#video').srcObject=stream;const detector=new BarcodeDetector({formats:['qr_code']});cameraLoop=setInterval(async()=>{try{const found=await detector.detect($('#video'));if(found.length){const code=found[0].rawValue.trim();stopCamera();if(scanTarget==='case'){scanCaseItem(code)}else if(scanTarget==='person'){const p=db.people.find(x=>x.id===code);if(p){chosen=p.id;$('#employee').value=p.id}else alert('Fant ikke ansatt: '+code)}else{$('#toolcode').value=code;processTool()}}}catch{}},450)}catch(e){alert('Kunne ikke åpne kamera: '+e.message);stopCamera()}}function stopCamera(){if(cameraLoop)clearInterval(cameraLoop);cameraLoop=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;const el=$('#scanner');if(el)el.classList.add('hidden')}function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='verktoykontroll-sikkerhetskopi.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function resetDemo(){if(confirm('Slette alle lokale endringer og gjenopprette testdata?')){db=seed();db.cases=[];save();render()}}render();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
